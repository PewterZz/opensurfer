name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or reset GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ inputs.version }}" --yes 2>/dev/null || true
          git push origin ":refs/tags/v${{ inputs.version }}" 2>/dev/null || true
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            --draft

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/opencode
        run: bun install

      - name: Build binary
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ needs.create-release.outputs.version }}
        run: bun script/build.ts --single --skip-embed-web-ui

      - name: Package and upload
        working-directory: packages/opencode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          NAME="opensurfer-${TARGET}"
          BIN="dist/${NAME}/bin"

          # On macOS: strip any corrupt signature from the build and apply a clean ad-hoc one
          if [[ "$TARGET" == darwin* ]]; then
            codesign --remove-signature "${BIN}/opensurfer" 2>/dev/null || true
            codesign --sign - --force "${BIN}/opensurfer"
          fi

          if [[ "$TARGET" == linux* ]]; then
            ARCHIVE="${NAME}.tar.gz"
            tar -czf "$ARCHIVE" -C "$BIN" opensurfer
          else
            ARCHIVE="${NAME}.zip"
            zip -j "$ARCHIVE" "${BIN}/opensurfer"
          fi

          gh release upload "v${VERSION}" "$ARCHIVE" \
            --clobber \
            --repo PewterZz/opensurfer

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ inputs.version }}" --draft=false
